<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سلتي</title>
<meta name="theme-color" content="#16a34a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلتي">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322c55e'/%3E%3Cstop offset='1' stop-color='%2315803d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='110' fill='url(%23g)'/%3E%3Ctext x='256' y='340' font-size='260' text-anchor='middle' fill='white'%3E%F0%9F%9B%8D%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"سلتي","short_name":"سلتي","display":"standalone","orientation":"portrait","dir":"rtl","lang":"ar","background_color":"#16a34a","theme_color":"#16a34a","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 512 512%27%3E%3Crect width=%27512%27 height=%27512%27 rx=%27110%27 fill=%27%2316a34a%27/%3E%3Ctext x=%27256%27 y=%27340%27 font-size=%27260%27 text-anchor=%27middle%27 fill=%27white%27%3E%F0%9F%9B%8D%3C/text%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml","purpose":"any"}]}'>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--o1:#16a34a;--o2:#22c55e;--o3:#15803d;--soft:#f1faf4;--card:#fff;--ink:#143323;--mute:#5f8a72;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--soft:#0f2a1a;--card:#14382a;--ink:#f1faf4;--mute:#a7d7bd}}
:root[data-theme="dark"]{--soft:#0f2a1a;--card:#14382a;--ink:#f1faf4;--mute:#a7d7bd}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:linear-gradient(160deg,var(--o2),var(--o3));display:flex;justify-content:center;align-items:center;color:var(--ink)}
.phone{width:100%;max-width:400px;height:100%;max-height:820px;background:var(--soft);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:500px){.phone{border-radius:36px;border:8px solid #fff3;box-shadow:0 20px 50px #0004}}
header{background:linear-gradient(135deg,var(--o2),var(--o1) 60%,var(--o3));color:#fff;padding:18px 18px 26px;border-radius:0 0 28px 28px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:22px;font-weight:800}
.top p{font-size:12px;opacity:.9}
.cartbtn{background:#fff;color:var(--o3);border:0;border-radius:14px;width:44px;height:44px;font-size:20px;position:relative;cursor:pointer}
.badge{position:absolute;top:-6px;left:-6px;background:var(--o3);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;border:2px solid #fff}
.search{margin-top:14px;background:#fff;border-radius:14px;display:flex;align-items:center;padding:0 12px;gap:8px}
.search input{flex:1;border:0;outline:0;height:42px;font:inherit;font-size:14px;background:transparent;color:#143323}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--card);color:var(--o3);font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer;display:flex;gap:6px;align-items:center;box-shadow:0 2px 6px #15803d20}
.chip.on{background:var(--o1);color:#fff}
main{flex:1;overflow-y:auto;padding:8px 14px 16px}
.sec{font-weight:800;font-size:16px;margin:8px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--card);border-radius:20px;padding:10px;box-shadow:0 4px 12px #15803d18;display:flex;flex-direction:column}
.pic{height:96px;border-radius:14px;background:linear-gradient(135deg,#d1fae5,#86efac);display:flex;align-items:center;justify-content:center;font-size:48px}
.item h3{font-size:13px;font-weight:600;margin:8px 2px 2px}
.item small{color:var(--mute);font-size:11px;margin:0 2px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:800;color:var(--o3);font-size:14px}
.add{border:0;background:var(--o1);color:#fff;width:32px;height:32px;border-radius:10px;font-size:18px;cursor:pointer}
.add:active{transform:scale(.9)}
nav{display:flex;background:var(--card);padding:8px 10px 10px;border-radius:24px 24px 0 0;box-shadow:0 -4px 14px #15803d22}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--o1);font-weight:800}
.sheet{position:absolute;inset:0;background:#0006;display:none;align-items:flex-end}
.sheet.show{display:flex}
.panel{background:var(--soft);width:100%;max-height:75%;border-radius:28px 28px 0 0;padding:18px;display:flex;flex-direction:column}
.panel h2{font-size:18px;color:var(--o3);margin-bottom:10px;display:flex;justify-content:space-between}
.panel h2 button{border:0;background:none;font-size:22px;color:var(--o3);cursor:pointer}
.lines{overflow-y:auto;flex:1}
.line{display:flex;align-items:center;gap:10px;background:var(--card);padding:8px 10px;border-radius:14px;margin-bottom:8px;font-size:13px}
.line b{flex:1;font-weight:600}
.q{display:flex;align-items:center;gap:6px}
.q button{border:0;background:var(--o1);color:#fff;width:24px;height:24px;border-radius:8px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:800;margin:10px 0}
.buy{border:0;background:linear-gradient(135deg,var(--o2),var(--o3));color:#fff;font:inherit;font-weight:800;padding:13px;border-radius:16px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:24px 0;font-size:14px}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--o3);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="top">
      <div><h1>سلتي</h1><p>تسوّقي كل ما تحتاجينه في مكان واحد</p></div>
      <button class="cartbtn" id="cartOpen" aria-label="السلة">🛒<span class="badge" id="badge">0</span></button>
    </div>
    <div class="search"><span>🔍</span><input id="q" placeholder="ابحثي عن منتج..."></div>
  </header>
  <div class="chips" id="chips"></div>
  <main id="main"></main>
  <nav>
    <button class="on" onclick="goHome(this)"><span>🏠</span>الرئيسية</button>
    <button onclick="openCart()"><span>🛍️</span>السلة</button>
    <button onclick="toast('قريباً: المفضلة')"><span>❤️</span>المفضلة</button>
    <button onclick="toast('قريباً: حسابي')"><span>👤</span>حسابي</button>
  </nav>
  <div class="sheet" id="sheet">
    <div class="panel">
      <h2>سلة المشتريات <button onclick="closeCart()" aria-label="إغلاق">×</button></h2>
      <div class="lines" id="lines"></div>
      <div class="total"><span>الإجمالي</span><span id="total">0 ج.م</span></div>
      <button class="buy" onclick="checkout()">إتمام الطلب</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const cats=[
 {id:'all',n:'الكل',i:'🧡'},
 {id:'clothes',n:'الملابس',i:'👗'},
 {id:'acc',n:'الإكسسوارات',i:'💍'},
 {id:'home',n:'الأواني المنزلية',i:'🍳'},
 {id:'shoes',n:'الأحذية',i:'👠'},
 {id:'beauty',n:'العطور والتجميل',i:'💄'}];
const P=[
 [1,'clothes','فستان سهرة','أنيق ومريح',450,'👗'],[2,'clothes','بلوزة قطن','مقاسات متعددة',180,'👚'],
 [3,'clothes','عباية عملية','خامة ناعمة',380,'🧥'],[4,'clothes','بنطلون جينز','قصة مستقيمة',260,'👖'],
 [5,'acc','عقد ذهبي','تصميم ناعم',150,'📿'],[6,'acc','حقيبة يد','جلد صناعي',320,'👜'],
 [7,'acc','نظارة شمس','حماية UV',210,'🕶️'],[8,'acc','ساعة يد','ستانلس ستيل',540,'⌚'],
 [9,'home','طقم حلل','٧ قطع',890,'🍲'],[10,'home','طقم أكواب','٦ قطع زجاج',120,'🥛'],
 [11,'home','طاسة تيفال','مانعة للالتصاق',230,'🍳'],[12,'home','طقم سكاكين','ستانلس',165,'🔪'],
 [13,'shoes','حذاء كعب','مريح للمناسبات',390,'👠'],[14,'shoes','حذاء رياضي','خفيف الوزن',480,'👟'],
 [15,'shoes','صندل صيفي','جلد طبيعي',210,'🩴'],[16,'shoes','بوت شتوي','بطانة دافئة',560,'👢'],
 [17,'beauty','عطر زهري','٩٠ مل',620,'🌸'],[18,'beauty','أحمر شفاه','لون ثابت',95,'💄'],
 [19,'beauty','كريم ترطيب','للبشرة الجافة',140,'🧴'],[20,'beauty','باليت ظلال','١٢ لون',175,'🎨']];
let cat='all',cart={};
const $=s=>document.querySelector(s);
function chips(){$('#chips').innerHTML=cats.map(c=>`<button class="chip ${c.id===cat?'on':''}" onclick="setCat('${c.id}')">${c.i} ${c.n}</button>`).join('')}
function setCat(c){cat=c;chips();render()}
function card(p){return `<div class="item"><div class="pic">${p[5]}</div><h3>${p[2]}</h3><small>${p[3]}</small><div class="row"><span class="price">${p[4]} ج.م</span><button class="add" onclick="add(${p[0]})" aria-label="أضف للسلة">+</button></div></div>`}
function render(){
 const t=$('#q').value.trim();
 const list=cat==='all'?cats.slice(1):cats.filter(c=>c.id===cat);
 let h='';
 list.forEach(c=>{
  const it=P.filter(p=>p[1]===c.id&&(!t||p[2].includes(t)));
  if(it.length)h+=`<div class="sec">${c.i} ${c.n}</div><div class="grid">${it.map(card).join('')}</div>`;
 });
 $('#main').innerHTML=h||'<div class="empty">لا توجد منتجات مطابقة، جرّبي كلمة أخرى</div>';
}
function add(id){cart[id]=(cart[id]||0)+1;upd();toast('تمت الإضافة للسلة')}
function chg(id,d){cart[id]+=d;if(cart[id]<=0)delete cart[id];upd();drawCart()}
function upd(){const n=Object.values(cart).reduce((a,b)=>a+b,0);const b=$('#badge');b.textContent=n;b.style.display=n?'flex':'none'}
function drawCart(){
 const ids=Object.keys(cart);let tot=0;
 $('#lines').innerHTML=ids.length?ids.map(id=>{const p=P.find(x=>x[0]==id);tot+=p[4]*cart[id];
  return `<div class="line"><span style="font-size:26px">${p[5]}</span><b>${p[2]}</b><div class="q"><button onclick="chg(${id},-1)">−</button>${cart[id]}<button onclick="chg(${id},1)">+</button></div></div>`}).join(''):'<div class="empty">السلة فارغة، أضيفي منتجاتك المفضلة</div>';
 $('#total').textContent=tot+' ج.م';
}
function openCart(){drawCart();$('#sheet').classList.add('show')}
function closeCart(){$('#sheet').classList.remove('show')}
function checkout(){if(!Object.keys(cart).length)return toast('السلة فارغة');cart={};upd();closeCart();toast('تم استلام طلبك بنجاح')}
function goHome(b){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');setCat('all')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}
$('#cartOpen').onclick=openCart;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeCart()};
$('#q').oninput=render;
chips();render();
</script>
</body>
</html>
